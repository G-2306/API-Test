
      - name: Debug and Run API Tests
        run: |
          echo "=== Find environment file ==="
          find . -type f

          ENV_FILE=$(find . -type f -name '*ReqRes*Env*' | head -n 1)
          COLLECTION=$(find . -type f -name '*ReqRes*collection*' | head -n 1)

          echo "Environment: $ENV_FILE"
          echo "Collection: $COLLECTION"

          if [ -z "$ENV_FILE" ]; then
            echo "Environment file is missing from GitHub."
            exit 1
          fi

          if [ -z "$COLLECTION" ]; then
            echo "Collection file is missing from GitHub."
            exit 1
          fi

          newman run "$COLLECTION" \
            -e "$ENV_FILE" \
            -d users.csv \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html
