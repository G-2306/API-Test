name: API Testing CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Find files
        run: |
          echo "Files in repository:"
          find . -type f

      - name: Run API Tests
        run: |
          COLLECTION=$(find . -type f -name "2474802010151_TruongGiaHuy_ReqRes.postman_collection" | head -n 1)

          ENV_FILE=$(find . -type f \( -iname "*environment*.json" -o -iname "*.postman_environment" -o -iname "*_Env*" \) | head -n 1)

          if [ -z "$COLLECTION" ]; then
            echo "ERROR: Collection file not found"
            exit 1
          fi

          if [ -z "$ENV_FILE" ]; then
            echo "ERROR: Environment file not found. Upload the exported Postman Environment to the repository."
            exit 1
          fi

          if [ ! -f "users.csv" ]; then
            echo "ERROR: users.csv not found in repository root"
            exit 1
          fi

          echo "Collection: $COLLECTION"
          echo "Environment: $ENV_FILE"

          newman run "$COLLECTION" \
            -e "$ENV_FILE" \
            -d users.csv \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: report.html
          if-no-files-found: warn
