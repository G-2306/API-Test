name: API Automated Monitor & Testing

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện GitHub
  schedule:
    # Lịch chạy tự động (Monitor): Chạy vào lúc 7:00 sáng mỗi ngày (Giờ UTC)
    - cron: '0 7 * * *'

jobs:
  api-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman & HTML Extra Reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API Monitoring Tests
        run: |
          newman run "2474802010151_TruongGiaHuy_ReqRes.postman_collection.json" \
            -e "2474802010151_TruongGiaHuy_ReqRes_Env.postman_environment.json" \
            --env-var "baseUrl=https://reqres.in" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export monitor-report.html

      - name: Upload Monitor HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-monitor-report
          path: monitor-report.html
          if-no-files-found: warn
